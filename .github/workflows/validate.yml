# SPDX-License-Identifier: MIT
# Checks every pull request and every push to develop and main with the
# reusable workflow from dag-node/ai-tools-assets-tools at a pinned version.
# The tools run from that version, not from this tree. Its tests job runs
# the tests each skill ships with its scripts, at Python 3.9 inside the
# pinned EL9 image and at 3.12.
name: validate

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  # A called job reports its check run as `<this job> / <called job>`. This
  # job is named for the repository, so its checks are
  # `ai-tools-assets / validate`, `ai-tools-assets / tests (python 3.9)` and
  # `ai-tools-assets / tests (python 3.12)`, the exact contexts the ruleset
  # on main requires.
  ai-tools-assets:
    uses: dag-node/ai-tools-assets-tools/.github/workflows/validate.yml@babd7c40d022c42f4d3d4899b869661731d712d2 # v1.4.0
    with:
      # The sign-off check fails the job here; the reusable workflow reports it alone until a caller sets this.
      enforce-signoff: true

