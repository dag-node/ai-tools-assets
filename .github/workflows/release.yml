# SPDX-License-Identifier: MIT
# Releases a set for its tag, <set>/v<semver>, through the reusable
# set-release workflow from dag-node/ai-tools-assets-tools, pinned at the
# same commit as validate.yml. That workflow verifies the tag's signature,
# runs `tools/validate` and `tools/check-publisher --repository`, builds the
# set, signs the zip, SHA256SUMS and the RPM with the org package-signing
# key, creates the release, and asks dag-node/rpm to publish the RPM.
# packaging/README.md lists what a release attaches.
#
# The called job runs under this repository's `release` environment,
# whose deployment policy admits tags `*/v*` and no branch; its secrets
# reach the job through `secrets: inherit`, since a job that calls
# a workflow cannot declare an environment. The job is named for the
# repository, so its check is `ai-tools-assets / release`.
name: release

on:
  push:
    tags: ['*/v*']

permissions:
  contents: read

jobs:
  # Pinned by commit rather than by the moving `v1` tag: the called workflow
  # runs with this repository's signing secrets, so the code it runs changes
  # only in a reviewed commit here.
  ai-tools-assets:
    uses: dag-node/ai-tools-assets-tools/.github/workflows/set-release.yml@e8035d0d0021e2ac8a8050849cb45a35566d11b0 # v1.1.0
    permissions:
      contents: write
    secrets: inherit
    with:
      dispatch-rpm: true
