# Who publishes this repository's sets. Read as KEY=value data, not
# executed. Every name and contact a set ships with is copied from
# here, and tools/check-publisher refuses a copy that differs. A fork
# that publishes sets its own values. See CONTRIBUTING.md.

# The GitHub owner of the repository; the marketplace is
# <publisher>-ai-tools-assets, and set names start with it.
publisher=dag-node

# The address in the plugin manifests' author and the marketplace's
# owner.
contact=tools@dagnode.com

# Every set.conf's maintainers.
maintainers=[maintainers@dagnode.com]

# The repository the sets are published from: every set.conf's
# source, and the manifests' homepage and repository.
source=https://github.com/dag-node/ai-tools-assets

# The marketplace's description, one line. Quoted in the character the
# value does not carry, since KEY=value has no escape.
description="Skills and subagents for coding agents, released as versioned sets"
